<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Croww Spatial Walkthrough</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #viewer-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #poster-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.6) blur(4px);
            z-index: 2;
            transition: opacity 0.5s ease;
        }
        #overlay-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            pointer-events: auto;
        }
        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .btn-icon {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-size: 18px;
        }
        .btn-icon:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .controls-bottom {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
            pointer-events: auto;
        }
        .control-pill {
            background: rgba(20, 24, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s ease;
        }
        .control-pill:active {
            background: rgba(255, 255, 255, 0.2);
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .loading-card {
            background: rgba(15, 20, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 24px 32px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(16px);
            max-width: 80%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
        }
        .progress-bar-wrap {
            width: 180px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            transition: width 0.2s ease;
        }
        #error-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            background: rgba(11, 15, 25, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            gap: 16px;
        }
        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        .error-body {
            font-size: 14px;
            color: #94a3b8;
            max-width: 320px;
            line-height: 1.5;
        }
        .btn-action {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/+esm",
        "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/+esm"
      }
    }
    </script>
</head>
<body>
    <div id="poster-bg"></div>
    <div id="viewer-container"></div>

    <div id="loading-screen">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-label">Loading Spatial Walkthrough…</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="overlay-ui">
        <div class="header-bar">
            <div class="header-title" id="walkthrough-title">Spatial Walkthrough</div>
            <button class="btn-icon" id="close-btn" aria-label="Close">✕</button>
        </div>
        <div class="controls-bottom">
            <button class="control-pill" id="reset-btn">⟲ Reset Camera</button>
            <button class="control-pill" id="fullscreen-btn">⛶ Fullscreen</button>
        </div>
    </div>

    <div id="error-screen">
        <div class="error-title">Spatial Walkthrough isn't available on this device.</div>
        <div class="error-body" id="error-desc">Photos and property facts remain available.</div>
        <button class="btn-action" id="error-close-btn">Return to Property</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

        const urlParams = new URLSearchParams(window.location.search);
        const assetUrl = urlParams.get('assetUrl') || '';
        const posterUrl = urlParams.get('posterUrl') || '';
        const title = urlParams.get('title') || 'Spatial Walkthrough';

        const container = document.getElementById('viewer-container');
        const posterBg = document.getElementById('poster-bg');
        const loadingScreen = document.getElementById('loading-screen');
        const progressBar = document.getElementById('progress-bar');
        const loadingLabel = document.getElementById('loading-label');
        const errorScreen = document.getElementById('error-screen');
        const errorDesc = document.getElementById('error-desc');
        const titleEl = document.getElementById('walkthrough-title');

        if (title) titleEl.textContent = title;
        if (posterUrl) posterBg.style.backgroundImage = `url("${posterUrl}")`;

        function notifyParent(action, payload = {}) {
            const data = JSON.stringify({ type: 'SPATIAL_VIEWER', action, ...payload });
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(data);
            } else if (window.parent && window.parent !== window) {
                window.parent.postMessage(data, '*');
            }
        }

        document.getElementById('close-btn').addEventListener('click', () => {
            cleanup();
            notifyParent('close');
        });

        document.getElementById('error-close-btn').addEventListener('click', () => {
            cleanup();
            notifyParent('close');
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        let viewer = null;

        function showError(msg) {
            loadingScreen.style.display = 'none';
            posterBg.style.display = 'none';
            if (msg) errorDesc.textContent = msg;
            errorScreen.style.display = 'flex';
        }

        function cleanup() {
            if (viewer) {
                try {
                    viewer.dispose();
                } catch (e) {
                    console.error('Viewer cleanup error:', e);
                }
                viewer = null;
            }
        }

        window.addEventListener('beforeunload', cleanup);

        async function initViewer() {
            if (!assetUrl) {
                showError('No spatial walkthrough asset URL provided.');
                return;
            }

            try {
                // Initialize GaussianSplats3D viewer
                viewer = new GaussianSplats3D.Viewer({
                    rootElement: container,
                    cameraUp: [0, 1, 0],
                    initialCameraPosition: [0, 1.2, 3],
                    initialCameraLookAt: [0, 1.0, 0],
                    sphericalHarmonicsDegree: 0,
                    gpuAcceleratedSort: true,
                    sharedMemoryForWorkers: false,
                    useBuiltInControls: true,
                });

                document.getElementById('reset-btn').addEventListener('click', () => {
                    if (viewer && viewer.camera) {
                        viewer.camera.position.set(0, 1.2, 3);
                        viewer.controls.target.set(0, 1.0, 0);
                        viewer.controls.update();
                    }
                });

                const splatFormat = assetUrl.endsWith('.ksplat')
                    ? GaussianSplats3D.SceneFormat.KSplat
                    : (assetUrl.endsWith('.ply')
                        ? GaussianSplats3D.SceneFormat.Ply
                        : GaussianSplats3D.SceneFormat.Splat);

                await viewer.addSplatScene(assetUrl, {
                    format: splatFormat,
                    streamView: true,
                    progressiveLoad: true,
                    onProgress: (percent, percentLabel) => {
                        const pct = Math.min(100, Math.max(0, Math.round(percent)));
                        progressBar.style.width = pct + '%';
                        loadingLabel.textContent = `Loading ${pct}%`;
                    }
                });

                // Splat scene ready
                loadingScreen.style.opacity = '0';
                posterBg.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    posterBg.style.display = 'none';
                }, 500);

                viewer.start();
                notifyParent('ready');

            } catch (err) {
                console.error('Failed to load spatial walkthrough:', err);
                showError("Spatial Walkthrough isn't available on this device.");
                notifyParent('error', { error: err?.message });
            }
        }

        // Start initialization
        initViewer();
    </script>
</body>
</html>
